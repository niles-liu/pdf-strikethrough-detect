version: 2
updates:
  # Keep GitHub Actions pinned and current. Dependabot can migrate `@vN` tags to commit SHAs and
  # bump them; enable via the repo's Dependabot settings if you want SHA-pinning enforced.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Bump the pinned floors in pyproject.toml (numpy / pymupdf / onnxruntime / extras).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # The [markdown] extra caps pymupdf4llm below 2 on Python 3.10 on purpose: pymupdf4llm 2.0 is
      # an empty placeholder for PyMuPDF 2.0, which ships the module (see pyproject.toml).
      - dependency-name: "pymupdf4llm"
        versions: [">=2"]

# USD per million tokens at the price list in force on the run date (PREREG.md, Operations), each
# with its date and source: Azure's for GPT-6, Vertex AI's for Gemini. `batch` is the multiplier
# for batched requests, and `flex` for GPT-6's Flex tier (0.5 is half price); thinking tokens bill
# as output. The dry run refuses a model without a price. Every price is the tier for short
# prompts (under 100K tokens on Haiku 5.5, 200K on Gemini and Grok, Azure's short context), which
# every request here is. Cached input is billed at the full input price, an overestimate where a
# provider caches on its own; `cache_write` is the multiplier on the input price for input a
# provider bills for writing to its cache, as Azure does GPT-6's, which writes nearly all of it
# (stage B1). `per_search` is xAI's charge per `attachment_search` call, the search tool its docs
# give a PDF (stage B1 saw one, on R6's several PDFs). `until` is a promotional price's last day:
# past it, submits and dry runs stop until the price is updated. `list_input` and `list_output`
# are the price after it, at which the tables also report each arm's cost (PREREG.md,
# Operations: Cost).

[opus-5-5]
input = 4.0
output = 20.0
batch = 0.5
date = "2026-10-15"
source = "platform.claude.com/docs/en/about-claude/pricing"


# The free arms bill their measured CPU-seconds at an on-demand price per vCPU-hour, named with
# the machine they were timed on; without the price their cost reads as unknown, never as zero.
# The timed runs go overnight, with nothing else running. The rate is GCP's n2-standard-2
# on-demand in us-central1 ($0.097118 an hour for 2 vCPUs and 8 GiB) per vCPU, memory included.

[cpu]
